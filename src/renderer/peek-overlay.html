<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="peek-overlay.css" />
    <title>Link preview</title>
  </head>
  <body role="dialog" aria-label="Link preview" aria-modal="true">
    <div id="split-drop-targets" hidden>
      <div class="split-drop-edge" data-split-side="left"><span>Split left</span></div>
      <div class="split-drop-edge" data-split-side="right"><span>Split right</span></div>
    </div>
    <button
      type="button"
      id="sidebar-toggle"
      data-action="sidebar-toggle"
      aria-label="Show sidebar"
      title="Show sidebar"
      hidden
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9 4v16" />
      </svg>
    </button>
    <div id="veil" aria-hidden="true"></div>
    <div id="surface">
      <div id="error" role="alert" hidden>
        <h2>This preview couldn’t be loaded.</h2>
        <p id="error-message"></p>
        <button type="button" data-action="reload">Try again</button>
      </div>
    </div>
    <div id="controls">
      <button
        type="button"
        data-action="close"
        aria-label="Close preview (Escape)"
        title="Close preview (Escape)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
      </button>
      <button
        type="button"
        data-action="promote"
        aria-label="Expand preview into a tab"
        title="Expand preview into a tab"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-6 6M10 19H5v-5M5 19l6-6" /></svg>
      </button>
    </div>
    <script src="peek-overlay.js"></script>
  </body>
</html>
